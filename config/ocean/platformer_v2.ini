[base]
package = ocean
env_name = puffer_platformer_v2
policy_name = Policy
rnn_name = Recurrent
vec = multiprocessing

[env]
num_envs = 512

[train]
total_timesteps = 200_000_000
batch_size = 131072

; [sweep]
; method = protein
; name = sweep

[sweep.metric]
goal = maximize
name = score 
min = -1
max = 1

[sweep.train.total_timesteps]
distribution = log_normal
min = 4e7
max = 2e8
mean = 9e7
scale = auto
