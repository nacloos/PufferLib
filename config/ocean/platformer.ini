[base]
package = ocean
env_name = puffer_platformer
vec = multiprocessing
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 512

[train]
total_timesteps = 100_000_000
checkpoint_interval = 50
num_envs = 8
num_workers = 8
env_batch_size = 4
batch_size = 32768

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 2e8
mean = 1e8
scale = auto